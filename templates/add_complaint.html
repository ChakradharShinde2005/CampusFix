<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Complaint | CampusFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fb;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar{
            background:#0d6efd;
        }

        .card-box{
            max-width:700px;
            margin:50px auto;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .card-header{
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            color:white;
            border-radius:20px 20px 0 0 !important;
            padding:20px;
        }

        .btn-submit{
            border-radius:30px;
            padding:10px;
        }
    </style>

</head>

<body>

<nav class="navbar navbar-dark px-4">

    <a class="navbar-brand fw-bold" href="/student_dashboard">
        <i class="bi bi-tools"></i>
        CampusFix
    </a>

    <a href="/student_dashboard" class="btn btn-light">
        <i class="bi bi-arrow-left"></i>
        Dashboard
    </a>

</nav>

<div class="container">

    <div class="card card-box">

        <div class="card-header">
            <h3 class="mb-0">
                <i class="bi bi-plus-circle"></i>
                Register New Complaint
            </h3>
        </div>

        <div class="card-body p-4">

            <form method="POST"
                  action="/add_complaint"
                  enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">Complaint Title</label>

                    <input type="text"
                           id="title"
                           class="form-control"
                           name="title"
                           placeholder="Enter complaint title"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Department</label>

                    <select class="form-select"
                            name="department"
                            required>

                        <option value="">Select Department</option>

                        <option>Library</option>
                        <option>Computer Lab</option>
                        <option>Wi-Fi</option>
                        <option>Canteen</option>
                        <option>Washroom</option>
                        <option>Classroom</option>
                        <option>Electricity</option>
                        <option>Transport</option>

                    </select>

                </div>
                 <div class="mb-3">

                    <label class="form-label">Complaint Priority</label>

                    <select id="priority" class="form-select" name="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">Complaint Description</label>
                    <div class="mb-3">

    <label class="form-label">
        Describe Your Problem
    </label>

    <div class="input-group">

        <input type="text"
               class="form-control"
               id="aiPrompt"
               placeholder="Example: WiFi is not working in Lab 3">

        <button type="button"
                class="btn btn-success"
                id="generateBtn">

            <i class="bi bi-stars"></i>

            Generate with AI

        </button>

    </div>

</div>

        <textarea
            class="form-control"
            id="description"
            rows="5"
            name="description"
            placeholder="Write your complaint here..."
            required></textarea>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Upload Evidence (Optional)
                    </label>

                    <input type="file"
                           class="form-control"
                           name="image"
                           accept="image/*">

                </div>

                <button class="btn btn-primary w-100 btn-submit">

                    <i class="bi bi-send-fill"></i>

                    Submit Complaint

                </button>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById("generateBtn").addEventListener("click", async function () {

    const problem = document.getElementById("aiPrompt").value.trim();

    if (problem === "") {
        alert("Please enter your problem first.");
        return;
    }

    const btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Generating...';

    const formData = new FormData();
    formData.append("problem", problem);

    try {

        const response = await fetch("/generate_complaint", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (data.success) {

        document.getElementById("title").value = data.title;

        document.getElementById("description").value = data.description;

        document.getElementById("priority").value = data.priority;

        document.querySelector('select[name="department"]').value = data.department;

        } else {

        alert(data.message);

    }

    } catch (err) {
        alert("Something went wrong while connecting to AI.");
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-stars"></i> Generate with AI';

});
</script>

</body>
</html>
