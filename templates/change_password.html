<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password | CampusFix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7fb;">

<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/profile">CampusFix</a>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</nav>

<div class="container mt-5">

    <div class="card shadow border-0 rounded-4 mx-auto" style="max-width:500px;">

        <div class="bg-primary text-white p-4 rounded-top-4">
            <h3 class="mb-0">Change Password</h3>
        </div>

        <div class="card-body p-4">

            <form method="POST" action="/change_password">

                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password"
                           name="current_password"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password"
                           name="new_password"
                           class="form-control"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password"
                           name="confirm_password"
                           class="form-control"
                           required>
                </div>

                <button class="btn btn-primary w-100">
                    Update Password
                </button>

                <a href="/profile" class="btn btn-secondary w-100 mt-2">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
