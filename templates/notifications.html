<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications | CampusFix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7fb;">

<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/student_dashboard">CampusFix</a>
    <div>
        <a href="/student_dashboard" class="btn btn-light btn-sm">Dashboard</a>
        <a href="/my_complaints" class="btn btn-outline-light btn-sm">My Complaints</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="bg-primary text-white p-4 rounded-4 mb-4">
        <h2>Notifications 🔔</h2>
        <p class="mb-0">Latest updates from admin.</p>
    </div>

    {% if notifications %}
        {% for n in notifications %}
        <div class="card shadow border-0 rounded-4 p-4 mb-3">
            <h5>{{ n[0] }}</h5>
            <p><b>Status:</b> {{ n[1] }}</p>
            <p><b>Admin Reply:</b> {{ n[2] }}</p>
            <small class="text-muted">Updated: {{ n[3] }}</small>
        </div>
        {% endfor %}
    {% else %}
        <div class="card shadow border-0 rounded-4 p-4 text-center">
            <h5>No notifications yet</h5>
        </div>
    {% endif %}
</div>

</body>
</html>
