<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | CampusFix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7fb;">

<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/student_dashboard">CampusFix</a>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</nav>

<div class="container mt-4">

    <div class="bg-primary text-white p-4 rounded-4 mb-4">
        <h2>My Profile</h2>
        <p class="mb-0">View your account details and complaint summary.</p>
    </div>

    <div class="row g-4">

        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4 p-4">
                <h4>Account Information</h4>
                <hr>

                <p><b>Name:</b> {{ name }}</p>
                <p><b>Email:</b> {{ email }}</p>
                <p><b>Role:</b> {{ role }}</p>

                <a href="/change_password" class="btn btn-primary w-100 mt-3">
                    Change Password
                </a>

                <a href="/student_dashboard" class="btn btn-secondary w-100 mt-2">
                    Back to Dashboard
                </a>
            </div>
        </div>

        <div class="col-md-7">
            <div class="row g-4">

                <div class="col-md-4">
                    <div class="card shadow border-0 rounded-4 text-center p-4">
                        <h5>Total</h5>
                        <h2>{{ total_complaints }}</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow border-0 rounded-4 text-center p-4">
                        <h5>Pending</h5>
                        <h2 class="text-warning">{{ pending_complaints }}</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow border-0 rounded-4 text-center p-4">
                        <h5>Resolved</h5>
                        <h2 class="text-success">{{ resolved_complaints }}</h2>
                    </div>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
